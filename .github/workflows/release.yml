name: Release

# Fully automated releases — no human versioning:
# every merge to master derives the semver bump from the squash-commit subject
# (= the PR title), commits the bump + tag back to master, builds the installers,
# and publishes a GitHub Release.
#
#   feat!: / fix!: / "BREAKING CHANGE" in body  → major
#   feat:                                        → minor
#   fix: / chore: / docs: / refactor: / anything → patch
#   "[skip release]" in subject or body          → no release
#
# TAG-ONLY: master is branch-protected, so CI never commits version bumps.
# The latest v* tag is the version source of truth; the build job injects the
# version into its workspace's package.json files right before packaging.
#
# NOTE ON KEYS: CI has no .env, so these builds contain NO baked-in _BUILTIN API
# keys. Installed builds work by entering keys once in Settings → Developer.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for a manual release
        type: choice
        options: [patch, minor, major]
        default: patch

# Serialize releases — two quick merges must not race the version commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag, create the release

jobs:
  # Release gate: `version` (which creates the tag) depends on this job, so a
  # red suite means no tag, no build, no release — for merge-triggered AND
  # manual workflow_dispatch releases alike.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in the root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          subject="$(git log -1 --format=%s)"
          body="$(git log -1 --format=%b)"

          # The [skip release] marker only governs merge-triggered releases —
          # a manual dispatch is an explicit "release now" and must ignore it
          # (HEAD's commit often carries the marker from a skipped merge).
          if [ "$EVENT" != "workflow_dispatch" ] && printf '%s %s' "$subject" "$body" | grep -qF '[skip release]'; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "skipping: [skip release] marker"
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            kind="$MANUAL_BUMP"
          elif printf '%s' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:' || printf '%s' "$body" | grep -qF 'BREAKING CHANGE'; then
            kind=major
          elif printf '%s' "$subject" | grep -qE '^feat'; then
            kind=minor
          else
            kind=patch
          fi

          # Latest v* tag is the current version (package.json is NOT authoritative).
          current="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          current="${current#v}"
          [ -z "$current" ] && current="0.1.0"

          next="$(node scripts/bump-version.mjs next "$kind" "$current")"
          echo "bump: $kind ($current → v$next)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$next"
          git push origin "v$next"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  # Create the release ONCE, with generated notes. The build matrix jobs only
  # attach their assets — both previously passed generate_release_notes:true,
  # and whichever finished second APPENDED a duplicate "What's Changed" body.
  create-release:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: false
          generate_release_notes: true

  build:
    needs: [version, create-release]
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64 → Nishboard-x.y.z-arm64.dmg
            artifact: release/*.dmg
          - os: windows-latest # x64 NSIS → Nishboard Setup x.y.z.exe
            artifact: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in the root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Inject the release version into THIS workspace's package.json files
      # (uncommitted) — electron-builder names artifacts from root, and
      # app.getVersion() reads apps/main. The repo files stay at their
      # placeholder version; the tag is the source of truth.
      - name: Set version from tag
        shell: bash
        run: node scripts/bump-version.mjs set "${TAG#v}"
        env:
          TAG: ${{ needs.version.outputs.tag }}

      # pnpm package = turbo build + electron-builder with
      # CSC_IDENTITY_AUTO_DISCOVERY=false already set (unsigned builds — macOS
      # users right-click → Open past Gatekeeper; signing needs paid certs).
      - run: pnpm package

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: ${{ matrix.artifact }}
          # Both matrix jobs target the same release (created with notes by
          # create-release) and ONLY add their asset — no body writes here,
          # or the second job would duplicate the notes.
          draft: false
