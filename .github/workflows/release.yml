name: Release

# Fully automated releases — no human versioning:
# every merge to master derives the semver bump from the squash-commit subject
# (= the PR title) and tags master. The release is created as a DRAFT, both
# platform builds upload their installers (plus the updater metadata) to it, and
# only when every build succeeded does the publish job add SHA256SUMS and flip
# the draft to published. A failed build leaves a draft, which is invisible to
# the auto-updater and to releases/latest.
#
#   feat!: / fix!: / "BREAKING CHANGE" in body  → major
#   feat:                                        → minor
#   fix: / chore: / docs: / refactor: / anything → patch
#   "[skip release]" in subject or body          → no release
#
# TAG-ONLY: master is branch-protected, so CI never commits version bumps.
# The latest v* tag is the version source of truth; the build job injects the
# version into its workspace's package.json files right before packaging.
#
# NOTE ON KEYS: CI has no .env, so these builds contain NO baked-in _BUILTIN API
# keys. Installed builds work by entering keys once in Settings → Developer.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for a manual release
        type: choice
        options: [patch, minor, major]
        default: patch

# Serialize releases — two quick merges must not race the version commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag, create the release

jobs:
  # Release gate: `version` (which creates the tag) depends on this job, so a
  # red typecheck, lint, test or build means no tag, no build, no release — for
  # merge-triggered AND manual workflow_dispatch releases alike.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in the root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  version:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          subject="$(git log -1 --format=%s)"
          body="$(git log -1 --format=%b)"

          # The [skip release] marker only governs merge-triggered releases —
          # a manual dispatch is an explicit "release now" and must ignore it
          # (HEAD's commit often carries the marker from a skipped merge).
          if [ "$EVENT" != "workflow_dispatch" ] && printf '%s %s' "$subject" "$body" | grep -qF '[skip release]'; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "skipping: [skip release] marker"
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            kind="$MANUAL_BUMP"
          elif printf '%s' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:' || printf '%s' "$body" | grep -qF 'BREAKING CHANGE'; then
            kind=major
          elif printf '%s' "$subject" | grep -qE '^feat'; then
            kind=minor
          else
            kind=patch
          fi

          # Latest v* tag is the current version (package.json is NOT authoritative).
          current="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          current="${current#v}"
          [ -z "$current" ] && current="0.1.0"

          next="$(node scripts/bump-version.mjs next "$kind" "$current")"
          echo "bump: $kind ($current → v$next)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$next"
          git push origin "v$next"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  # Create the release ONCE, as a draft, with generated notes. The build matrix
  # jobs only attach their assets; `publish` flips the draft once all succeeded.
  create-release:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --draft --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"

  build:
    needs: [version, create-release]
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64 → Nishboard-x.y.z-arm64.dmg (+ blockmap and latest-mac.yml when emitted)
            upload: release/*.dmg release/*.dmg.blockmap release/latest-mac.yml
          - os: windows-latest # x64 NSIS → Nishboard-Setup-x.y.z.exe + blockmap + latest.yml
            upload: release/*.exe release/*.exe.blockmap release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in the root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Inject the release version into THIS workspace's package.json files
      # (uncommitted) — electron-builder names artifacts from root, and
      # app.getVersion() reads apps/main. The repo files stay at their
      # placeholder version; the tag is the source of truth.
      - name: Set version from tag
        shell: bash
        run: node scripts/bump-version.mjs set "${TAG#v}"
        env:
          TAG: ${{ needs.version.outputs.tag }}

      # pnpm package = turbo build + electron-builder with
      # CSC_IDENTITY_AUTO_DISCOVERY=false already set (unsigned builds — macOS
      # users right-click → Open past Gatekeeper; signing needs paid certs).
      - run: pnpm package

      # Upload to the draft release. Globs that match nothing are skipped (an
      # optional blockmap or latest-mac.yml may not exist), but at least one
      # installer (.exe or .dmg) must match or the job fails.
      - name: Upload artifacts to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          UPLOAD: ${{ matrix.upload }}
        run: |
          shopt -s nullglob
          files=()
          for pattern in $UPLOAD; do
            for f in $pattern; do
              files+=("$f")
            done
          done
          installers=0
          for f in "${files[@]}"; do
            case "$f" in
              *.exe|*.dmg) installers=$((installers + 1)) ;;
            esac
          done
          if [ "$installers" -eq 0 ]; then
            echo "::error::no installer matched: $UPLOAD"
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # Runs only when every build leg succeeded: checksum all assets, then publish
  # the draft and mark it latest.
  publish:
    needs: [version, build]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" -D assets --repo "$GITHUB_REPOSITORY"
          cd assets
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cd ..
          gh release upload "$TAG" assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
