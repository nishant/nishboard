name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version comes from packageManager in the root package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: node scripts/check-electron-version.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Full build (shared → server bundle → renderer → main) BEFORE the tests:
      # buildChunks.test.ts inspects the renderer's dist/index.html. No .env in
      # CI, so the server bundle bakes no _BUILTIN keys — fine for a check.
      - run: pnpm build

      - run: pnpm test
