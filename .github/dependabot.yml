version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: electron
      # react-resizable is pinned to ^3 only for its CSS: react-grid-layout 1.5
      # bundles v3. Hold its majors while RGL stays on 1.5.
      - dependency-name: react-resizable
        update-types:
          - version-update:semver-major
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /apps/main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    allow:
      - dependency-name: electron
  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    # Action majors are taken (SHA-pinned), so no semver-major ignore here.
